<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotipay</title>

  <!-- Spotify Mix Font (local – upload font files) -->
  <style>
    @font-face {
      font-family: "Spotify Mix";
      src: url("fonts/SpotifyMix-Regular.woff2") format("woff2");
      font-weight: normal;
      font-style: normal;
    }
  </style>

  <!-- Google Font fallback -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6c6ff5;
      --dark: #0f172a;
      --gray: #e5e7eb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      background: #6b7280;
      color: white;
      line-height: 1.6;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 4rem;
      background: transparent;
    }

    /* 🎧 Spotify Mix Logo */
    header h1 {
      font-family: "Spotify Mix", "Inter", sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
    }

    nav a {
      margin-left: 2rem;
      text-decoration: none;
      color: #e5e7eb;
      font-weight: 500;
    }

    nav a:hover {
      color: white;
    }

    .hero {
      padding: 5rem 4rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .hero h2 {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }

    .hero p {
      color: #e5e7eb;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    .btn {
      padding: 1rem 2.2rem;
      background: var(--primary);
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
    }

    /* 🎵 SLIDING ARTIST IMAGE BOX */
    .hero-img {
      width: 100%;
      height: 360px;
      border-radius: 30px;
      background-size: cover;
      background-position: center;
      animation: artistSlide 60s infinite ease-in-out;
    }

    /* 🔁 TOP 10 ARTIST SLIDER */
    @keyframes artistSlide {
      0%   { background-image: url("https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4"); }
      10%  { background-image: url("https://images.unsplash.com/photo-1507874457470-272b3c8d8ee2"); }
      20%  { background-image: url("https://images.unsplash.com/photo-1514361892635-eae31e65ad38"); }
      30%  { background-image: url("https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f"); }
      40%  { background-image: url("https://images.unsplash.com/photo-1506157786151-b8491531f063"); }
      50%  { background-image: url("https://images.unsplash.com/photo-1518972559570-0d3d7b36f56b"); }
      60%  { background-image: url("https://images.unsplash.com/photo-1521337581100-8ca9a73a5f79"); }
      70%  { background-image: url("https://images.unsplash.com/photo-1497032628192-86f99bcd76bc"); }
      80%  { background-image: url("https://images.unsplash.com/photo-1487180144351-b8472da7d491"); }
      90%  { background-image: url("https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f"); }
      100% { background-image: url("https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4"); }
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .hero-img {
        height: 280px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Spotipay</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Features</a>
      <a href="#">Artist</a>
      <a href="#">Album</a>
    </nav>
  </header>

  <section class="hero">
    <div>
      <h2>Feel the Sound</h2>
      <p>Press play. Let the world fade.</p>
      <a href="#" class="btn">Get Started</a>
    </div>

    <!-- 🎶 SLIDING ARTIST IMAGES -->
    <div class="hero-img"></div>
  </section>

</body>
</html>
